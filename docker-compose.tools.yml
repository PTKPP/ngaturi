services:
  chromadb:
    image: chromadb/chroma:1.0.20
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
      ANONYMIZED_TELEMETRY: "FALSE"
    ports:
      - "127.0.0.1:${CHROMA_PORT:-3333}:8000"
    volumes:
      - chroma-data:/chroma/chroma
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q -O - http://localhost:8000/api/v2/heartbeat >/dev/null 2>&1 || wget -q -O - http://localhost:8000/api/v1/heartbeat >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - knowledge_internal

networks:
  knowledge_internal:
    internal: true

volumes:
  chroma-data:
